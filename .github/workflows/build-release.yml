name: Build and Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write   # create GitHub releases
  packages: write   # publish to GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
          source-url: https://nuget.pkg.github.com/starsadmin/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "props=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore "ssdump.slnx"

      - name: Build
        run: dotnet build "ssdump.slnx" -c Release --no-restore ${{ steps.version.outputs.props }}

      - name: Pack
        run: dotnet pack "ssdumpLibrary/ssdumpLibrary.csproj" -p:PackageID="ssdumpLibrary" -c Release --no-build -o ./artifacts ${{ steps.version.outputs.props }}

      - uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: ./artifacts/*.nupkg

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" ./artifacts/*.nupkg --title "$GITHUB_REF_NAME" --generate-notes
